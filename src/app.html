<!doctype html>
<html lang="pt-BR">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<link rel="icon" href="%sveltekit.assets%/favicon.svg" type="image/svg+xml" />
		<!--
			Aplica o tema salvo ANTES da primeira pintura. Sem isso, quem escolheu o tema
			escuro veria um lampejo claro em cada navegação. É pequeno e síncrono de
			propósito - qualquer atraso aqui é visível.
		-->
		<script>
			try {
				var tema = localStorage.getItem("tema")
				if (tema === "claro" || tema === "escuro") document.documentElement.dataset.tema = tema
			} catch (e) {
				/* armazenamento bloqueado: segue a preferência do sistema */
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>

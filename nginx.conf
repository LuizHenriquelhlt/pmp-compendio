# Servidor do compêndio: site estático, sem API e sem fallback de SPA.
#
# O `npm run build` termina em `ferramentas/portatil.mjs`, que grava cada rota como
# pasta/index.html em vez de pasta.html — a forma que todo servidor estático resolve
# sozinho, aqui e em qualquer host gerenciado. Então o `try_files` abaixo não precisa de
# nada excepcional: é o `index index.html` de sempre.
#
# `$uri.html` continua na lista por tolerância, para um build feito com `vite build` puro,
# sem o passo de portabilidade. Se você está depurando um 404 em /moves, é por aí que
# começa: veja se build/moves/index.html existe.

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	index index.html;
	charset utf-8;

	# As páginas são geradas no build: o 404 do compêndio é uma página de verdade,
	# e tem de chegar ao navegador com o status 404, não com 200.
	error_page 404 /404.html;

	location = /404.html {
		internal;
	}

	# Os assets com hash no nome nunca mudam de conteúdo — podem ficar no cache para sempre.
	location /_app/immutable/ {
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location / {
		# $uri            → arquivos reais (favicon.svg, _app/…, moves/__data.json)
		# $uri/index.html → as rotas do prerender (/moves → moves/index.html)
		# $uri.html       → tolerância a um build sem o passo de portabilidade
		try_files $uri $uri/index.html $uri.html =404;

		# O HTML é reassado a cada build; revalidar evita servir uma página velha
		# depois de `docker compose up --build`.
		add_header Cache-Control "no-cache";
	}

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;
}

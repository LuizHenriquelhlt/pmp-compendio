# Servidor do compêndio: site estático, sem API e sem fallback de SPA.
#
# O adapter-static do SvelteKit grava uma rota por ARQUIVO, não por pasta:
# /moves → moves.html, /sobre → sobre.html, /moves/absorb → moves/absorb.html.
# Um servidor estático comum não tenta a extensão sozinho, e por isso devolve 404 em
# /sobre e 301 para /moves/ (pasta que existe, mas não tem index.html) — o que quebra
# todas as abas fora do `npm run dev`, que resolve a extensão por conta própria.
#
# `try_files $uri $uri.html` é o que conserta isso, e é a razão de este arquivo existir.
# A alternativa seria `trailingSlash: "always"` no SvelteKit, que faria o build emitir
# pasta/index.html — mas isso mudaria toda a forma das URLs do compêndio (/moves/ em vez
# de /moves), inclusive as de espécie que já estão decididas. Preferimos adaptar o
# servidor ao desenho das URLs, não o contrário.

server {
	listen 80;
	server_name _;
	root /usr/share/nginx/html;

	index index.html;
	charset utf-8;

	# As páginas são geradas no build: o 404 do compêndio é uma página de verdade,
	# e tem de chegar ao navegador com o status 404, não com 200.
	error_page 404 /404.html;

	location = /404.html {
		internal;
	}

	# Os assets com hash no nome nunca mudam de conteúdo — podem ficar no cache para sempre.
	location /_app/immutable/ {
		expires 1y;
		add_header Cache-Control "public, max-age=31536000, immutable";
		try_files $uri =404;
	}

	location / {
		# $uri      → arquivos reais (favicon.svg, _app/…, moves/__data.json)
		# $uri.html → as rotas do prerender (/moves → moves.html)
		# $uri/index.html → cobre a raiz e qualquer pasta que venha a ter índice próprio
		try_files $uri $uri.html $uri/index.html =404;

		# O HTML é reassado a cada build; revalidar evita servir uma página velha
		# depois de `docker compose up --build`.
		add_header Cache-Control "no-cache";
	}

	gzip on;
	gzip_types text/css application/javascript application/json image/svg+xml;
	gzip_min_length 1024;
}
